services:
  - type: web
    name: easy-reserve-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_default_superuser
    startCommand: cd backend && gunicorn EasyReserve.wsgi
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: FRONTEND_URL
        value: https://easy-reserve-frontend-propre-iota.vercel.app
      - key: DJANGO_SUPERUSER_USERNAME
        value: Merveille
      - key: DJANGO_SUPERUSER_PASSWORD
        value: Password2026
      - key: DJANGO_SUPERUSER_EMAIL
        value: merveille@example.com
    disk:
      name: easy-reserve-data
      mountPath: /data
      sizeGB: 1
databases:
  - name: easy-reserve-db
    databaseName: easy_reserve
    user: easy_reserve
    plan: free
